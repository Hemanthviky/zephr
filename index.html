<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The mark is raster artwork, so the tab icon ships at the two sizes a
         browser actually asks for rather than as one scalable file. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <!-- Opaque cream, because iOS composites a home-screen icon onto black
         and would otherwise ring the disc in it. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
    <!-- Overwritten by the boot script below, and again by the theme toggle. -->
    <meta name="theme-color" content="#FDF7EA" />

    <!-- Dark mode, before the first paint.
         This has to be inline and it has to be here, above the stylesheet: the
         app's own theme code doesn't run until the JS bundle has downloaded and
         React has mounted, by which point someone who chose dark has already
         been shown a full screen of cream. Reading one localStorage key costs
         well under a millisecond and is the difference between a themed app and
         a flashbang. Kept deliberately in step with src/hooks/useTheme.js.

         Only an explicit stored 'dark' counts. The OS preference is not
         consulted here or anywhere else: light is the app's default, and dark
         is something a user turns on rather than something their phone turns on
         for them. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('zephr:theme') === 'dark') {
            document.documentElement.classList.add('dark')
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute('content', '#15130F')
          }
        } catch (e) {
          // Storage blocked. Light is the fallback, which is what the document
          // already says.
        }
      })()
    </script>
    <meta name="description" content="Zephr — the day-to-day tracker. Calories and macros, money and budgets, an intake chart for fluids and medicines, and notes with an encrypted vault. Four trackers, one login, typed by hand." />
    <!-- The standard name first; the apple- prefixed one stays for iOS versions
         that still only understand that spelling. Chrome warns if it sees the
         apple one without this. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Link previews. The image is the lockup on the app's own cream, at the
         1200×630 both Open Graph and Twitter read without re-cropping. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zephr" />
    <meta property="og:title" content="Zephr — your day, tracked by hand" />
    <meta
      property="og:description"
      content="Calories and macros, money and budgets, an intake chart for fluids and medicines, and notes with an encrypted vault. Four trackers, one login."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- The first thing the app does after boot is ask Supabase for a session,
         which means a DNS lookup and a TLS handshake to an origin the browser
         has never seen. Starting that here overlaps it with the JS download.
         Vite substitutes the env value at build time. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />

    <!-- The two faces every first paint needs, fetched from our own origin and
         started here rather than after the CSS parses. `crossorigin` isn't
         optional even same-origin: fonts are fetched in anonymous mode, and a
         preload without it downloads the file a second time.

         The latin-ext companions are deliberately not preloaded — their
         @font-face unicode-ranges keep them off the wire until something
         renders an accented character or a rupee sign. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/bricolage-grotesque-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/plus-jakarta-sans-latin.woff2"
      crossorigin
    />

    <title>Zephr — your day, tracked by hand</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
